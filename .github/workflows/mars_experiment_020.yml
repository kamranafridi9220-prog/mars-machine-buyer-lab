name: MARS Experiment 020 Statistical Benchmark

on:
  workflow_dispatch:

jobs:

  statistical-robustness-benchmark:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ==========================================
      # CHECKOUT REPOSITORY
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # SET UP PYTHON
      # ==========================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ==========================================
      # VERIFY PYTHON ENVIRONMENT
      # ==========================================

      - name: Verify Python
        run: |
          python --version
          python -m pip --version


      # ==========================================
      # RUN EXPERIMENT 020
      # ==========================================

      - name: Run MARS Experiment 020
        run: python -m experiments.test_statistical_robustness
