name: MARS Autonomous Buyer Experiment

on:
  workflow_dispatch:

jobs:

  run-buyer-experiment:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: '3.11'

      # ==========================================
      # INSTALL AI DEPENDENCIES
      # ==========================================

      - name: Install OpenAI Python SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai

      # ==========================================
      # EXISTING MARS EXPERIMENTS
      # ==========================================

      - name: Run MARS Experiment 001
        run: python -m experiments.test_buyer

      - name: Run MARS Experiment 002
        run: python -m experiments.test_policy_inference

      - name: Run MARS Experiment 003
        run: python -m experiments.test_multidimensional_inference

      - name: Run MARS Experiment 004
        run: python -m experiments.test_minimum_intervention

      - name: Run MARS Experiment 005
        run: python -m experiments.test_negotiation

      - name: Run MARS Experiment 006
        run: python -m experiments.test_adaptive_negotiation

      - name: Run MARS Experiment 007
        run: python -m experiments.test_policy_drift

      - name: Run MARS Experiment 008
        run: python -m experiments.test_deal_rescue

      - name: Run MARS Experiment 009
        run: python -m experiments.test_commercial_learning

      - name: Run MARS Experiment 010
        run: python -m experiments.test_adversarial_negotiation

      # ==========================================
      # EXPERIMENT 011 — GENERATIVE AI SUPPLIER
      # ==========================================

      - name: Run MARS Experiment 011
        env:

      - name: Run MARS Experiment 012
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m experiments.test_active_policy_discovery
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        run: python -m experiments.test_ai_supplier_strategy
